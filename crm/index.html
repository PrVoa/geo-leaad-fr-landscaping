<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM Paysagistes — Geo-Leaad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #718096;
    --primary: #3b82f6;
    --danger: #ef4444;
    --s-nouveau:          #94a3b8;
    --s-contacte:         #3b82f6;
    --s-en_discussion:    #f97316;
    --s-solution_envoyee: #84cc16;
    --s-relance_essai:    #a855f7;
    --s-accompagne:       #06b6d4;
    --s-gagne:            #22c55e;
    --s-perdu:            #ef4444;
    --s-pas_interesse:    #f43f5e;
    --s-sans_suite:       #6b7280;
    --s-hors_cible:       #64748b;
    --s-a_ferme:          #475569;
  }

  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  /* ── HEADER ── */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 1.1rem; font-weight: 700; flex-shrink: 0; }
  .stats-bar { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat-chip {
    font-size: .75rem;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .stat-chip.total            { background: #e2e8f0; color: #475569; }
  .stat-chip.today            { background: #dbeafe; color: #1d4ed8; }
  .stat-chip.contacte         { background: #eff6ff; color: #1d4ed8;  border-color: var(--s-contacte); }
  .stat-chip.en_discussion    { background: #fff7ed; color: #c2410c;  border-color: var(--s-en_discussion); }
  .stat-chip.solution_envoyee { background: #f7fee7; color: #3f6212;  border-color: var(--s-solution_envoyee); }
  .stat-chip.gagne            { background: #f0fdf4; color: #15803d;  border-color: var(--s-gagne); }
  .stat-chip.perdu            { background: #fef2f2; color: #b91c1c;  border-color: var(--s-perdu); }
  .stat-chip.hors_cible       { background: #f1f5f9; color: #334155;  border-color: var(--s-hors_cible); }

  #realtime-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #94a3b8; flex-shrink: 0;
    transition: background .4s;
  }
  #realtime-dot.connected { background: #22c55e; }

  #user-info { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-shrink: 0; }
  #user-name { font-size: .82rem; color: var(--muted); font-weight: 500; }
  #btn-logout {
    font-size: .78rem; background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--muted); transition: all .15s;
  }
  #btn-logout:hover { background: #fef2f2; border-color: var(--danger); color: var(--danger); }

  /* ── FILTRES ── */
  #filters {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  #filters input[type=search], #filters input[type=text], #filters select {
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px;
    font-size: .82rem; background: var(--bg); color: var(--text); outline: none; transition: border-color .2s;
  }
  #filters input:focus, #filters select:focus { border-color: var(--primary); }
  #search { min-width: 200px; }

  .filter-check {
    display: flex; align-items: center; gap: 5px;
    font-size: .82rem; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .filter-check input { cursor: pointer; accent-color: var(--primary); }

  .filters-right { display: flex; gap: 8px; margin-left: auto; align-items: center; }
  #btn-export {
    font-size: .8rem; background: #f0fdf4; border: 1px solid #86efac;
    border-radius: 6px; padding: 5px 12px; cursor: pointer; color: #15803d; font-weight: 600; transition: all .15s;
  }
  #btn-export:hover { background: #dcfce7; }
  #btn-reset {
    font-size: .8rem; color: var(--muted); cursor: pointer;
    background: none; border: none; padding: 4px 8px; border-radius: 4px;
  }
  #btn-reset:hover { background: var(--border); }

  /* ── BULK BAR ── */
  #bulk-bar {
    display: none; align-items: center; gap: 12px;
    background: #1d4ed8; color: white;
    padding: 9px 24px; font-size: .85rem;
  }
  #bulk-bar.visible { display: flex; }
  #bulk-count { font-weight: 700; }
  .bulk-btn {
    background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4);
    border-radius: 6px; padding: 4px 12px; cursor: pointer; color: white;
    font-size: .8rem; transition: background .15s;
  }
  .bulk-btn:hover { background: rgba(255,255,255,.35); }
  #bulk-cancel { background: none; border: none; color: rgba(255,255,255,.7); cursor: pointer; margin-left: auto; font-size: .8rem; }

  /* ── TABLE ── */
  #wrap { padding: 16px 24px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  thead th {
    background: var(--card); border-bottom: 2px solid var(--border);
    padding: 9px 10px; text-align: left; font-weight: 600;
    color: var(--muted); white-space: nowrap;
  }
  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--text); }
  thead th.sort-asc::after  { content: ' ↑'; color: var(--primary); }
  thead th.sort-desc::after { content: ' ↓'; color: var(--primary); }

  tbody tr { border-bottom: 1px solid var(--border); background: var(--card); transition: background .1s; }
  tbody tr:hover { background: #f8fafc; }
  tbody tr.selected { background: #eff6ff; }
  tbody td { padding: 8px 10px; vertical-align: top; }

  .col-check  { width: 32px; text-align: center; }
  .col-dept   { text-align: center; width: 44px; }
  .col-name   { min-width: 150px; font-weight: 600; }
  .col-ville  { min-width: 110px; color: var(--muted); font-size: .8rem; }
  .col-phone  { white-space: nowrap; }
  .col-email  { min-width: 160px; font-size: .78rem; word-break: break-all; }
  .col-rating { text-align: center; width: 70px; white-space: nowrap; }
  .col-status { width: 110px; }
  .col-notes  { min-width: 180px; }
  .col-recall { width: 120px; }
  .col-links  { white-space: nowrap; }

  input[type=checkbox] { cursor: pointer; accent-color: var(--primary); width: 14px; height: 14px; }

  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── BADGES STATUT ── */
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: .73rem; font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap;
  }
  .badge.nouveau            { background: #f1f5f9; color: #475569; }
  .badge.contacte           { background: #eff6ff; color: #1d4ed8; }
  .badge.en_discussion      { background: #fff7ed; color: #c2410c; }
  .badge.solution_envoyee   { background: #f7fee7; color: #3f6212; }
  .badge.relance_essai      { background: #faf5ff; color: #6b21a8; }
  .badge.accompagne         { background: #ecfeff; color: #0e7490; }
  .badge.gagne              { background: #f0fdf4; color: #15803d; }
  .badge.perdu              { background: #fef2f2; color: #b91c1c; }
  .badge.pas_interesse      { background: #fff1f2; color: #9f1239; }
  .badge.sans_suite         { background: #f9fafb; color: #4b5563; }
  .badge.hors_cible         { background: #f1f5f9; color: #334155; }
  .badge.a_ferme            { background: #f8fafc; color: #1e293b; }

  select.status-select {
    font-size: .75rem; border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 4px; background: var(--card); cursor: pointer;
  }

  /* ── DROPDOWN STATUT CUSTOM ── */
  .status-dropdown {
    position: fixed; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.14);
    z-index: 9999; min-width: 190px; padding: 4px 0; font-size: .82rem;
  }
  .sd-group {
    padding: 7px 12px 3px; font-size: .68rem; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); cursor: default; user-select: none;
  }
  .sd-group:not(:first-child) { border-top: 1px solid var(--border); margin-top: 3px; }
  .sd-option {
    padding: 5px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .sd-option:hover { background: var(--bg); }
  .sd-option .badge { pointer-events: none; font-size: .72rem; }

  /* ── NOTES ── */
  .notes-cell { position: relative; }
  .notes-text {
    min-height: 26px; padding: 3px 6px; border-radius: 5px;
    border: 1px solid transparent; cursor: pointer; color: var(--text);
    font-size: .8rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word;
  }
  .notes-text:hover { border-color: var(--border); background: var(--bg); }
  .notes-text:empty::before { content: '+ note'; color: var(--muted); font-style: italic; }
  textarea.notes-ta {
    width: 100%; min-height: 56px; resize: vertical;
    border: 1px solid var(--primary); border-radius: 5px; padding: 4px 6px;
    font-size: .8rem; font-family: inherit; outline: none; background: var(--card);
  }
  .save-indicator { font-size: .68rem; color: var(--muted); position: absolute; bottom: -13px; right: 0; }

  /* ── RAPPEL ── */
  input.rappel-input {
    border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px;
    font-size: .8rem; font-family: inherit; background: var(--bg); color: var(--text); width: 110px;
  }
  input.rappel-input.overdue { border-color: var(--danger); background: #fef2f2; }

  /* ── PAGINATION ── */
  #pagination {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 14px 24px; font-size: .83rem; color: var(--muted); flex-wrap: wrap;
  }
  .page-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 14px; cursor: pointer; font-size: .83rem; transition: background .15s;
  }
  .page-btn:hover:not(:disabled) { background: var(--border); }
  .page-btn:disabled { opacity: .4; cursor: default; }
  #f-page-size {
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px;
    font-size: .8rem; background: var(--bg); color: var(--text); cursor: pointer;
  }

  /* ── LOADER / ERROR ── */
  #loader { text-align: center; padding: 40px; color: var(--muted); font-size: .9rem; display: none; }
  #loader.visible { display: block; }
  #error-msg {
    background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
    border-radius: 8px; padding: 12px 18px; margin: 16px 24px;
    font-size: .85rem; display: none;
  }
  #error-msg.visible { display: block; }

  /* ── LOGIN ── */
  #login-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1e3a5f 0%, #2d6a4f 100%);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #login-overlay.hidden { display: none; }
  .login-card {
    background: var(--card); border-radius: 14px; padding: 40px 36px;
    width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.3); text-align: center;
  }
  .login-card h2 { font-size: 1.4rem; margin-bottom: 6px; }
  .login-card p  { color: var(--muted); font-size: .88rem; margin-bottom: 28px; }
  .login-form-group { display: flex; flex-direction: column; gap: 12px; }
  .login-form-group input {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
    font-size: .9rem; font-family: inherit; outline: none; transition: border-color .2s;
  }
  .login-form-group input:focus { border-color: var(--primary); }
  #login-btn {
    margin-top: 6px; background: var(--primary); color: #fff; border: none;
    border-radius: 8px; padding: 11px; font-size: .95rem; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  #login-btn:hover { background: #2563eb; }
  #login-btn:disabled { background: #93c5fd; cursor: default; }
  #login-error { margin-top: 12px; color: var(--danger); font-size: .82rem; min-height: 18px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-card">
    <h2>🌿 CRM Paysagistes</h2>
    <p>Connectez-vous pour accéder au CRM</p>
    <div class="login-form-group">
      <input type="email"    id="login-email" placeholder="Email" autocomplete="email" required />
      <input type="password" id="login-pwd"   placeholder="Mot de passe" autocomplete="current-password" required />
      <button id="login-btn">Se connecter</button>
    </div>
    <div id="login-error"></div>
  </div>
</div>

<!-- CRM -->
<div id="crm-app" style="display:none">

<header>
  <h1>🌿 CRM Paysagistes</h1>
  <div class="stats-bar" id="stats-bar">
    <span class="stat-chip total"            id="s-total">—</span>
    <span class="stat-chip today"            id="s-today">—</span>
    <span class="stat-chip contacte"         id="s-contacte"         data-statut="contacte">—</span>
    <span class="stat-chip en_discussion"    id="s-en_discussion"    data-statut="en_discussion">—</span>
    <span class="stat-chip solution_envoyee" id="s-solution_envoyee" data-statut="solution_envoyee">—</span>
    <span class="stat-chip gagne"            id="s-gagne"            data-statut="gagne">—</span>
    <span class="stat-chip perdu"            id="s-perdu"            data-statut="perdu">—</span>
    <span class="stat-chip hors_cible"       id="s-hors_cible"       data-statut="hors_cible">—</span>
  </div>
  <div id="user-info">
    <span id="user-name"></span>
    <button id="btn-logout">Déconnexion</button>
    <div id="realtime-dot" title="Sync temps réel"></div>
  </div>
</header>

<div id="filters">
  <input type="search" id="search" placeholder="🔍 Rechercher partout (Ctrl+F)…" />
  <select id="f-statut">
    <option value="">Tous les statuts</option>
    <optgroup label="── Par défaut ──">
      <option value="nouveau">Nouveau</option>
    </optgroup>
    <optgroup label="── Dans le pipe ──">
      <option value="contacte">Contacté</option>
      <option value="en_discussion">En discussion</option>
      <option value="solution_envoyee">Solution envoyée</option>
      <option value="relance_essai">Relancé pour essai</option>
      <option value="accompagne">Accompagné</option>
      <option value="gagne">Gagné</option>
    </optgroup>
    <optgroup label="── No Go ──">
      <option value="perdu">Perdu</option>
      <option value="pas_interesse">Pas intéressé</option>
      <option value="sans_suite">Sans suite</option>
      <option value="hors_cible">Hors cible</option>
      <option value="a_ferme">A fermé</option>
    </optgroup>
  </select>
  <select id="f-dept"><option value="">Tous les depts</option></select>
  <label class="filter-check"><input type="checkbox" id="f-has-email" /> A un email</label>
  <label class="filter-check"><input type="checkbox" id="f-has-phone" /> A un tél</label>
  <select id="f-site">
    <option value="">Site web : tous</option>
    <option value="yes">Avec site</option>
    <option value="no">Sans site</option>
  </select>
  <select id="f-rappel">
    <option value="">Rappels : tous</option>
    <option value="today">Aujourd'hui</option>
    <option value="overdue">En retard</option>
    <option value="upcoming">Dans 7 jours</option>
  </select>
  <select id="f-assigne"><option value="">Tous les assignés</option></select>
  <div class="filters-right">
    <button id="btn-export">⬇ CSV</button>
    <button id="btn-reset">✕ Réinitialiser</button>
  </div>
</div>

<div id="bulk-bar">
  <span id="bulk-count">0 sélectionnés</span>
  <span style="opacity:.5">|</span>
  <span style="font-size:.8rem">Changer statut :</span>
  <button class="bulk-btn" data-statut="contacte">Contacté</button>
  <button class="bulk-btn" data-statut="en_discussion">En discussion</button>
  <button class="bulk-btn" data-statut="solution_envoyee">Solution envoyée</button>
  <button class="bulk-btn" data-statut="relance_essai">Relancé pour essai</button>
  <button class="bulk-btn" data-statut="accompagne">Accompagné</button>
  <button class="bulk-btn" data-statut="gagne">Gagné</button>
  <button class="bulk-btn" data-statut="perdu">Perdu</button>
  <button class="bulk-btn" data-statut="pas_interesse">Pas intéressé</button>
  <button class="bulk-btn" data-statut="sans_suite">Sans suite</button>
  <button class="bulk-btn" data-statut="hors_cible">Hors cible</button>
  <button class="bulk-btn" data-statut="a_ferme">A fermé</button>
  <button id="bulk-cancel">✕ Annuler</button>
</div>

<div id="error-msg"></div>
<div id="loader" class="visible">Chargement…</div>

<div id="wrap">
  <table>
    <thead>
      <tr>
        <th class="col-check"><input type="checkbox" id="select-all" title="Tout sélectionner" /></th>
        <th class="sortable col-dept"   data-col="dept">Dept</th>
        <th class="sortable col-name"   data-col="name">Nom</th>
        <th class="col-ville">Ville</th>
        <th class="sortable col-phone"  data-col="phone">Téléphone</th>
        <th class="col-email">Email</th>
        <th class="sortable col-rating" data-col="rating">Note</th>
        <th class="col-status">Statut</th>
        <th class="col-notes">Notes</th>
        <th class="sortable col-recall" data-col="rappel_le">Rappel</th>
        <th class="col-links">Liens</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div id="pagination">
  <button class="page-btn" id="btn-prev" disabled>← Préc.</button>
  <span id="page-info"></span>
  <button class="page-btn" id="btn-next" disabled>Suiv. →</button>
  <select id="f-page-size">
    <option value="25">25 / page</option>
    <option value="50" selected>50 / page</option>
    <option value="100">100 / page</option>
  </select>
</div>

</div><!-- /crm-app -->

<script>
// ── CONFIG ──
const SUPABASE_URL      = 'https://tzwrzkiqdkcgaqnxntyt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1qXmP6t8kV5Kl5LhfPcEog_iMAR3pI6';

// Groupes de statuts (pour les selects avec séparateurs)
const STATUT_GROUPS = [
  { label: 'Par défaut',    items: ['nouveau'] },
  { label: 'Dans le pipe',  items: ['contacte','en_discussion','solution_envoyee','relance_essai','accompagne','gagne'] },
  { label: 'No Go',         items: ['perdu','pas_interesse','sans_suite','hors_cible','a_ferme'] },
];
const STATUTS = STATUT_GROUPS.flatMap(g => g.items);
const LABEL = {
  nouveau:          'Nouveau',
  contacte:         'Contacté',
  en_discussion:    'En discussion',
  solution_envoyee: 'Solution envoyée',
  relance_essai:    'Relancé pour essai',
  accompagne:       'Accompagné',
  gagne:            'Gagné',
  perdu:            'Perdu',
  pas_interesse:    'Pas intéressé',
  sans_suite:       'Sans suite',
  hors_cible:       'Hors cible',
  a_ferme:          'A fermé',
};
const TODAY   = new Date().toISOString().slice(0,10);

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── STATE ──
let currentUser  = null;
let currentPage  = 0;
let totalCount   = 0;
let pageSize     = 50;
let sortCol      = 'scraped_at';
let sortAsc      = false;
let selectedIds  = new Set();
let debounceTimer = null;
let filters = { search:'', statut:'', dept:'', assigne:'', rappel:'', hasEmail:false, hasPhone:false, site:'' };

// ── AUTH ──
function showLogin() {
  document.getElementById('login-overlay').classList.remove('hidden');
  document.getElementById('crm-app').style.display = 'none';
}
function showCRM(user) {
  currentUser = user;
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('crm-app').style.display = 'block';
  document.getElementById('user-name').textContent = user.user_metadata?.name || user.email;
}

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const pwd   = document.getElementById('login-pwd').value;
  const errEl = document.getElementById('login-error');
  const btn   = document.getElementById('login-btn');
  errEl.textContent = '';
  if (!email || !pwd) { errEl.textContent = 'Email et mot de passe requis.'; return; }
  btn.disabled = true; btn.textContent = 'Connexion…';
  const { data, error } = await db.auth.signInWithPassword({ email, password: pwd });
  btn.disabled = false; btn.textContent = 'Se connecter';
  if (error) { errEl.textContent = error.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect.' : error.message; return; }
  showCRM(data.user);
  await startCRM();
});
document.getElementById('login-pwd').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-btn').click(); });
document.getElementById('btn-logout').addEventListener('click', async () => { await db.auth.signOut(); currentUser = null; showLogin(); });

// ── HELPERS ──
function showError(msg) { const e = document.getElementById('error-msg'); e.textContent = msg; e.classList.add('visible'); }
function hideError()    { document.getElementById('error-msg').classList.remove('visible'); }
function showLoader(v)  { document.getElementById('loader').classList.toggle('visible', v); }
function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }
function isOverdue(d) { return d && d < TODAY; }
function extractVille(address) {
  if (!address) return '';
  const m = address.match(/\d{5}\s+([^,]+)/);
  if (m) return m[1].trim();
  // fallback : dernier fragment avant ", France"
  const parts = address.replace(/, France$/i, '').split(',');
  return parts[parts.length - 1].trim();
}

// ── BUILD QUERY ──
function buildQuery() {
  let q = db.from('landscapers').select(
    'place_id,name,phone,address,website,email,maps_url,rating,review_count,statut,notes,rappel_le,assigne_a,dept,scraped_at',
    { count: 'exact' }
  );
  if (filters.search) {
    const s = filters.search.trim();
    q = q.or(`name.ilike.%${s}%,phone.ilike.%${s}%,email.ilike.%${s}%,address.ilike.%${s}%,notes.ilike.%${s}%,assigne_a.ilike.%${s}%,dept.ilike.%${s}%`);
  }
  if (filters.statut)    q = q.eq('statut', filters.statut);
  if (filters.dept)      q = q.eq('dept', filters.dept);
  if (filters.assigne)   q = q.eq('assigne_a', filters.assigne);
  if (filters.hasEmail)  q = q.not('email', 'is', null);
  if (filters.hasPhone)  q = q.not('phone', 'is', null);
  if (filters.site === 'yes') q = q.not('website', 'is', null).neq('website', '');
  if (filters.site === 'no')  q = q.or('website.is.null,website.eq.');
  if (filters.rappel === 'today')    q = q.eq('rappel_le', TODAY);
  if (filters.rappel === 'overdue')  q = q.lt('rappel_le', TODAY).not('rappel_le', 'is', null);
  if (filters.rappel === 'upcoming') {
    const in7 = new Date(); in7.setDate(in7.getDate() + 7);
    q = q.gte('rappel_le', TODAY).lte('rappel_le', in7.toISOString().slice(0,10));
  }
  return q;
}

// ── LOAD PAGE ──
async function loadPage() {
  showLoader(true); hideError();
  const from = currentPage * pageSize;
  const { data, error, count } = await buildQuery()
    .order(sortCol, { ascending: sortAsc })
    .range(from, from + pageSize - 1);
  showLoader(false);
  if (error) { showError('Erreur Supabase : ' + error.message); return; }
  totalCount = count ?? 0;
  renderTable(data || []);
  renderPagination();
  updateSortHeaders();
}

// ── RENDER TABLE ──
function renderTable(rows) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(r => {
    const isSelected = selectedIds.has(r.place_id);
    const rating = r.rating ? `★${r.rating.toFixed(1)} <small style="color:var(--muted)">(${r.review_count||0})</small>` : '<span style="color:var(--muted)">—</span>';
    const emailCell = r.email ? `<a href="mailto:${esc(r.email)}" title="${esc(r.email)}">${esc(r.email)}</a>` : '<span style="color:var(--muted)">—</span>';
    return `<tr data-id="${esc(r.place_id)}" class="${isSelected ? 'selected' : ''}">
      <td class="col-check"><input type="checkbox" class="row-check" data-id="${esc(r.place_id)}" ${isSelected ? 'checked' : ''} /></td>
      <td class="col-dept">${esc(r.dept || '—')}</td>
      <td class="col-name">${esc(r.name)}</td>
      <td class="col-ville">${esc(extractVille(r.address))}</td>
      <td class="col-phone">${r.phone ? `<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : '<span style="color:var(--muted)">—</span>'}</td>
      <td class="col-email">${emailCell}</td>
      <td class="col-rating">${rating}</td>
      <td class="col-status">${renderStatus(r)}</td>
      <td class="col-notes notes-cell">${renderNotes(r)}</td>
      <td class="col-recall">${renderRappel(r)}</td>
      <td class="col-links">${renderLinks(r)}</td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('.badge').forEach(el => el.addEventListener('click', onBadgeClick));
  tbody.querySelectorAll('.notes-text').forEach(el => el.addEventListener('click', onNotesClick));
  tbody.querySelectorAll('.rappel-input').forEach(el => el.addEventListener('change', onRappelChange));
  tbody.querySelectorAll('.row-check').forEach(el => el.addEventListener('change', onRowCheck));
  document.getElementById('select-all').checked = rows.length > 0 && rows.every(r => selectedIds.has(r.place_id));
}

function renderStatus(r) {
  const s = r.statut || 'nouveau';
  return `<span class="badge ${s}" data-id="${esc(r.place_id)}" data-statut="${s}">${LABEL[s]||s}</span>`;
}
function renderNotes(r) {
  const txt = r.notes ? esc(r.notes).replace(/\n/g,'<br>') : '';
  return `<div class="notes-text" data-id="${esc(r.place_id)}" data-notes="${esc(r.notes||'')}">${txt}</div>`;
}
function renderRappel(r) {
  const od = isOverdue(r.rappel_le) ? ' overdue' : '';
  return `<input type="date" class="rappel-input${od}" data-id="${esc(r.place_id)}" value="${esc(r.rappel_le||'')}" />`;
}
function renderLinks(r) {
  const parts = [];
  if (r.maps_url) parts.push(`<a href="${esc(r.maps_url)}" target="_blank">Maps</a>`);
  if (r.website)  parts.push(`<a href="${esc(r.website)}" target="_blank">Web</a>`);
  return parts.join(' · ') || '<span style="color:var(--muted)">—</span>';
}

// ── SORT ──
function updateSortHeaders() {
  document.querySelectorAll('thead th.sortable').forEach(th => {
    th.classList.remove('sort-asc','sort-desc');
    if (th.dataset.col === sortCol) th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
  });
}
document.querySelectorAll('thead th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    if (sortCol === th.dataset.col) sortAsc = !sortAsc;
    else { sortCol = th.dataset.col; sortAsc = false; }
    currentPage = 0;
    loadPage();
  });
});

// ── PAGINATION ──
function renderPagination() {
  const totalPages = Math.ceil(totalCount / pageSize) || 1;
  document.getElementById('page-info').textContent =
    `Page ${currentPage+1}/${totalPages} — ${totalCount.toLocaleString('fr-FR')} leads`;
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage >= totalPages - 1;
}
document.getElementById('btn-prev').addEventListener('click', () => { currentPage--; loadPage(); });
document.getElementById('btn-next').addEventListener('click', () => { currentPage++; loadPage(); });
document.getElementById('f-page-size').addEventListener('change', e => {
  pageSize = parseInt(e.target.value); currentPage = 0; loadPage();
});

// ── UPDATE ──
async function updateField(id, fields) {
  const { error } = await db.from('landscapers').update(fields).eq('place_id', id);
  if (error) showError('Erreur sauvegarde : ' + error.message);
  else hideError();
}

// ── STATUS BADGE ──
function onBadgeClick(e) {
  e.stopPropagation();
  document.querySelectorAll('.status-dropdown').forEach(d => d.remove());

  const badge = e.currentTarget;
  const id = badge.dataset.id, cur = badge.dataset.statut || 'nouveau';

  const dropdown = document.createElement('div');
  dropdown.className = 'status-dropdown';

  STATUT_GROUPS.forEach(group => {
    const header = document.createElement('div');
    header.className = 'sd-group';
    header.textContent = group.label;
    dropdown.appendChild(header);

    group.items.forEach(s => {
      const opt = document.createElement('div');
      opt.className = 'sd-option';
      const b = document.createElement('span');
      b.className = `badge ${s}`;
      b.textContent = LABEL[s];
      if (s === cur) b.style.outline = '2px solid currentColor';
      opt.appendChild(b);
      opt.addEventListener('click', async ev => {
        ev.stopPropagation();
        dropdown.remove();
        if (s === cur) return;
        await updateField(id, { statut: s });
        badge.className = `badge ${s}`;
        badge.textContent = LABEL[s];
        badge.dataset.statut = s;
        loadStats();
      });
      dropdown.appendChild(opt);
    });
  });

  const rect = badge.getBoundingClientRect();
  dropdown.style.visibility = 'hidden';
  dropdown.style.left = rect.left + 'px';
  dropdown.style.top  = (rect.bottom + 4) + 'px';
  document.body.appendChild(dropdown);

  // Repositionner si le dropdown sort de l'écran
  const ddH = dropdown.offsetHeight;
  const ddW = dropdown.offsetWidth;
  if (rect.bottom + 4 + ddH > window.innerHeight) {
    dropdown.style.top = Math.max(4, rect.top - ddH - 4) + 'px';
  }
  if (rect.left + ddW > window.innerWidth) {
    dropdown.style.left = Math.max(4, window.innerWidth - ddW - 8) + 'px';
  }
  dropdown.style.visibility = '';

  // Fermer au clic extérieur
  setTimeout(() => {
    document.addEventListener('click', function close() {
      dropdown.remove();
      document.removeEventListener('click', close);
    }, { once: true });
  }, 0);
}

// ── NOTES ──
function onNotesClick(e) {
  const div = e.currentTarget;
  if (div.querySelector('textarea')) return;
  const id = div.dataset.id, cur = div.dataset.notes || '';
  const ta = document.createElement('textarea'); ta.className='notes-ta'; ta.value=cur;
  const ind = document.createElement('span'); ind.className='save-indicator';
  div.innerHTML=''; div.appendChild(ta); div.appendChild(ind); ta.focus();
  let t = null;
  ta.addEventListener('input', () => { clearTimeout(t); ind.textContent='…'; t=setTimeout(async()=>{ await updateField(id,{notes:ta.value}); div.dataset.notes=ta.value; ind.textContent='✓'; },1200); });
  ta.addEventListener('blur', () => {
    clearTimeout(t); updateField(id,{notes:ta.value}); div.dataset.notes=ta.value;
    div.innerHTML = ta.value ? esc(ta.value).replace(/\n/g,'<br>') : '';
    div.addEventListener('click', onNotesClick, {once:true});
  });
}

// ── RAPPEL ──
async function onRappelChange(e) {
  const inp=e.currentTarget, val=inp.value||null;
  inp.classList.toggle('overdue', isOverdue(val));
  await updateField(inp.dataset.id, { rappel_le: val });
}

// ── BULK ──
function onRowCheck(e) {
  const id = e.currentTarget.dataset.id;
  const row = e.currentTarget.closest('tr');
  if (e.currentTarget.checked) { selectedIds.add(id); row.classList.add('selected'); }
  else { selectedIds.delete(id); row.classList.remove('selected'); }
  updateBulkBar();
}
document.getElementById('select-all').addEventListener('change', e => {
  document.querySelectorAll('.row-check').forEach(cb => {
    cb.checked = e.target.checked;
    const row = cb.closest('tr');
    if (e.target.checked) { selectedIds.add(cb.dataset.id); row.classList.add('selected'); }
    else { selectedIds.delete(cb.dataset.id); row.classList.remove('selected'); }
  });
  updateBulkBar();
});
function updateBulkBar() {
  const bar = document.getElementById('bulk-bar');
  bar.classList.toggle('visible', selectedIds.size > 0);
  document.getElementById('bulk-count').textContent = `${selectedIds.size} sélectionné(s)`;
}
document.querySelectorAll('.bulk-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const ids = [...selectedIds];
    const { error } = await db.from('landscapers').update({ statut: btn.dataset.statut }).in('place_id', ids);
    if (!error) { selectedIds.clear(); updateBulkBar(); loadPage(); loadStats(); }
    else showError('Erreur bulk : ' + error.message);
  });
});
document.getElementById('bulk-cancel').addEventListener('click', () => {
  selectedIds.clear();
  document.querySelectorAll('.row-check').forEach(cb => cb.checked=false);
  document.querySelectorAll('tbody tr').forEach(tr => tr.classList.remove('selected'));
  document.getElementById('select-all').checked = false;
  updateBulkBar();
});

// ── EXPORT CSV ──
document.getElementById('btn-export').addEventListener('click', async () => {
  const btn = document.getElementById('btn-export');
  btn.textContent = '…';
  const { data, error } = await buildQuery().order(sortCol, { ascending: sortAsc });
  btn.textContent = '⬇ CSV';
  if (error || !data) { showError('Erreur export'); return; }
  const headers = ['Dept','Ville','Nom','Téléphone','Email','Adresse','Note','Avis','Statut','Notes','Rappel','Assigné','Maps','Site Web'];
  const rows = data.map(r => [
    r.dept||'', extractVille(r.address), r.name||'', r.phone||'', r.email||'',
    r.address||'', r.rating||'', r.review_count||'',
    r.statut||'nouveau', r.notes||'', r.rappel_le||'', r.assigne_a||'',
    r.maps_url||'', r.website||''
  ]);
  const csv = 'sep=;\r\n' + [headers,...rows].map(row =>
    row.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')
  ).join('\r\n');
  // Encode en Windows-1252 : Excel Windows lit les CSV en cette locale par défaut.
  // Les caractères hors-plage (rares) sont remplacés par '?'.
  const W1252 = {8364:128,8218:130,402:131,8222:132,8230:133,8224:134,8225:135,710:136,8240:137,352:138,8249:139,338:140,381:142,8216:145,8217:146,8220:147,8221:148,8226:149,8211:150,8212:151,732:152,8482:153,353:154,8250:155,339:156,382:158,376:159};
  const bytes = new Uint8Array(csv.length);
  for (let i = 0; i < csv.length; i++) {
    const c = csv.charCodeAt(i);
    bytes[i] = c < 128 ? c : (c < 256 ? c : (W1252[c] ?? 63));
  }
  const blob = new Blob([bytes], { type: 'text/csv;charset=windows-1252' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`paysagistes_${TODAY}.csv`; a.click();
  URL.revokeObjectURL(url);
});

// ── STATS ──
async function loadStats() {
  try {
    const { count: total } = await db.from('landscapers').select('place_id',{count:'exact',head:true});
    document.getElementById('s-total').textContent = `${(total||0).toLocaleString('fr-FR')} total`;
    const { count: today } = await db.from('landscapers').select('place_id',{count:'exact',head:true}).gte('scraped_at',TODAY+'T00:00:00');
    document.getElementById('s-today').textContent = `+${today||0} aujourd'hui`;
    const HEADER_STATUTS = ['contacte','en_discussion','solution_envoyee','gagne','perdu','hors_cible'];
    for (const s of HEADER_STATUTS) {
      const el = document.getElementById(`s-${s}`);
      if (!el) continue;
      const { count } = await db.from('landscapers').select('place_id',{count:'exact',head:true}).eq('statut',s);
      el.textContent = `${LABEL[s]} ${count||0}`;
    }
  } catch (_) {}
}

// Clic sur stat chip → filtre par statut
document.querySelectorAll('.stat-chip[data-statut]').forEach(chip => {
  chip.addEventListener('click', () => {
    const s = chip.dataset.statut;
    const sel = document.getElementById('f-statut');
    sel.value = filters.statut === s ? '' : s;
    filters.statut = sel.value;
    currentPage = 0; loadPage();
  });
});

// ── FILTRES ──
async function loadFilterOptions() {
  try {
    const { data: depts } = await db.rpc('crm_depts');
    if (depts) {
      const fd = document.getElementById('f-dept');
      depts.forEach(d => { const o=document.createElement('option'); o.value=d.dept; o.textContent=`${d.dept} (${d.nb})`; fd.appendChild(o); });
    }
  } catch(_) {}
  try {
    const { data: assignes } = await db.rpc('crm_assignes');
    if (assignes) {
      const fa = document.getElementById('f-assigne');
      assignes.forEach(a => { const o=document.createElement('option'); o.value=a.assigne_a; o.textContent=a.assigne_a; fa.appendChild(o); });
    }
  } catch(_) {}
}

function resetFilters() {
  filters = { search:'', statut:'', dept:'', assigne:'', rappel:'', hasEmail:false, hasPhone:false, site:'' };
  document.getElementById('search').value = '';
  ['f-statut','f-dept','f-assigne','f-rappel','f-site'].forEach(id => document.getElementById(id).value='');
  document.getElementById('f-has-email').checked = false;
  document.getElementById('f-has-phone').checked = false;
  currentPage = 0; loadPage();
}

// Ctrl+F / Cmd+F → focus la recherche
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    const searchEl = document.getElementById('search');
    if (searchEl) { e.preventDefault(); searchEl.focus(); searchEl.select(); }
  }
});

document.getElementById('search').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { filters.search=e.target.value; currentPage=0; loadPage(); }, 400);
});
[['f-statut','statut'],['f-dept','dept'],['f-assigne','assigne'],['f-rappel','rappel'],['f-site','site']].forEach(([id,key]) => {
  document.getElementById(id).addEventListener('change', e => { filters[key]=e.target.value; currentPage=0; loadPage(); });
});
document.getElementById('f-has-email').addEventListener('change', e => { filters.hasEmail=e.target.checked; currentPage=0; loadPage(); });
document.getElementById('f-has-phone').addEventListener('change', e => { filters.hasPhone=e.target.checked; currentPage=0; loadPage(); });
document.getElementById('btn-reset').addEventListener('click', resetFilters);

// ── REALTIME ──
function initRealtime() {
  const dot = document.getElementById('realtime-dot');
  db.channel('landscapers-crm')
    .on('postgres_changes', { event:'*', schema:'public', table:'landscapers' }, () => loadStats())
    .subscribe(s => dot.classList.toggle('connected', s==='SUBSCRIBED'));
}

// ── START ──
async function startCRM() {
  try {
    await Promise.allSettled([loadStats(), loadFilterOptions()]);
    await loadPage();
    initRealtime();
  } catch(err) {
    showLoader(false);
    showError('Erreur Supabase : ' + (err.message||err));
  }
}

// ── BOOT ──
(async function init() {
  if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === 'VOTRE_CLE_ANON_ICI') {
    document.getElementById('login-overlay').classList.add('hidden');
    document.getElementById('crm-app').style.display = 'block';
    showLoader(false);
    showError('Configurez SUPABASE_ANON_KEY dans crm/index.html');
    return;
  }
  const { data: { session } } = await db.auth.getSession();
  if (session?.user) { showCRM(session.user); await startCRM(); }
  else showLogin();
  db.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT' || !session) { currentUser = null; showLogin(); }
  });
})();
</script>
